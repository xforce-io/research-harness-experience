# project.yaml — structured project soul
# Topic: Post-Deployment Agent Engineering Stack
# (Observability → Triage → Relabeling → Model Iteration)

research_questions:
  - id: RQ1
    text: "How can agent trajectories be triaged for high-replay-value (failures, hidden friction, and instructive successes) without per-trajectory LLM-as-Judge calls — i.e. via lightweight signals from interaction, execution, and environment surfaces?"
  - id: RQ2
    text: "How can failed or friction-laden agent trajectories be hindsight-relabeled into preference / SFT data suitable for DPO/RLHF, and what taxonomy of failure modes determines whether a trajectory is recoverable?"
  - id: RQ3
    text: "What logging / trace schema is needed to support both signal-based triage and hindsight relabeling — covering operational, cognitive, contextual, user-interaction, and system-resource surfaces?"
  - id: RQ4
    text: "How can observability cost (the 'observability tax') be controlled in production agent systems via dynamic sampling, sentinel triggers, and topology-aware telemetry — and how do those mechanisms compose with signal-based triage?"
  - id: RQ5
    text: "How do non-semantic signal methods (phrase patterns, sequence analysis, action-component graphs) compare with — and complement — semantic evaluation paradigms (LLM-as-Judge, Agent-as-a-Judge, TIDE/TRACE) for finding learnable trajectories?"
  - id: RQ6
    text: "Are there agent-trajectory failure modes (esp. for orchestrated multi-step execution with weak user-facing dialog) that current signal taxonomies miss, and what new signal classes does a production agent system need to define beyond the published literature?"

inclusion_criteria:
  - "Must address one of RQ1–RQ6, ideally with an implementable mechanism (detector, schema, pipeline, or relabeling rule), not just a position."
  - "Must report enough method detail to be at least partially reproducible: input schema, decision rule, or quantitative threshold/effect size."
  - "Trace-level or trajectory-level granularity is preferred over single-turn or token-level work."
  - "Production-deployment angle (cost, drift, schema versioning, latency) earns extra weight."

exclusion_criteria:
  - "Pure benchmark papers without a methodological contribution."
  - "Pure LLM-as-Judge papers that ignore cost-of-judging at production scale."
  - "Theoretical / survey papers that don't introduce an implementable framing."
  - "Token-level or single-turn evaluation work with no trajectory-level extension."
  - "Papers focused solely on training-time rollout selection with no deployment-time analogue (TSR-class is admitted, but only when contrasted with deployment-time triage)."

sources:
  - kind: arxiv
    queries:
      - "agent trajectory triage"
      - "agent trajectory sampling preference data"
      - "hindsight experience replay LLM agent"
      - "agent trajectory relabeling RLHF DPO"
      - "agent observability tracing"
      - "agent trace schema structured logging"
      - "LLM agent failure mode taxonomy"
      - "agent-as-a-judge"
      - "tool-use agent evaluation diagnostic"
    priority: high
  - kind: semantic_scholar
    queries:
      - "agent trajectory observability"
      - "implicit feedback signals agent dialogue"
      - "topology-aware sampling distributed tracing"
    priority: normal
  # NOTE: agent originally drafted a kind: ieee source which the schema
  # rejected. IEEE-paywalled material (e.g. "Breaking the Observability Tax")
  # is folded into the queries above; the read stage cannot fetch IEEE PDFs
  # directly under the current Plan-2 toolset.

paper_axes:
  - id: layer
    name: "Stack layer"
    values:
      - "L0_observability_infra"
      - "L1_signal_triage"
      - "L2_data_relabeling"
      - "L3_model_iteration"
      - "cross_evaluation"
  - id: signal_kind
    name: "Signal source"
    values:
      - "interaction"
      - "execution"
      - "environment"
      - "cognitive"
      - "topological"
  - id: cost_profile
    name: "Compute cost regime"
    values:
      - "rule_based"
      - "small_surrogate"
      - "llm_judge"
      - "agent_judge"
  - id: lifecycle
    name: "When the method runs"
    values:
      - "training_time"
      - "deployment_time"
      - "online"
  - id: deployability
    name: "Production-readiness signal"
    values:
      - "open_implementation"
      - "method_only"
      - "concept_only"

cadence:
  default_interval_days: 7
  backoff_after_empty_runs: 3
