# project.yaml — experience loop
meta:
  topic_oneline: "生产 agent 的改进介质是自身交互流：捕获（结构化轨迹+轻量分诊）→ 更新（权重或 harness）→ 对齐部署的评价；前线轻量信号，评价必须拆掉采样假象。"
  language: zh

research_questions:
  - id: RQ1
    text: "How can production agent trajectories be captured and triaged into a learnable experience stream without per-trajectory LLM-as-Judge — via schema, lightweight signals, and sentinel sampling?"
  - id: RQ2
    text: "How should a triaged experience stream update the system — hindsight relabel / process credit into weights, versus editing the executable harness without touching target weights?"
  - id: RQ3
    text: "How must evaluation be designed so harness or policy gains are not confounded with extra test-time sampling, and so feedback loops audit their own reliability?"

inclusion_criteria:
  - "Must address RQ1–RQ3 with an implementable mechanism (detector, schema, relabel rule, harness edit, or eval protocol), not just a position."
  - "Trajectory- or loop-level granularity; production or deployment-aligned metrics earn extra weight."
  - "Harness-evolution work must contrast against a sampling/TTS baseline or held-out split."

exclusion_criteria:
  - "Pure benchmark papers without a methodological contribution."
  - "Pure LLM-as-Judge papers that ignore cost-of-judging at production scale."
  - "Generic agentic RL recipes, scale-only narratives, world models, inference serving, or decision-orchestration work (other pillars / first-half)."
  - "Token-level or single-turn evaluation with no trajectory-level extension."
  - "Auto-fix loops that report only end-to-end delta and never audit feedback reliability — admitted only as negative controls."

sources:
  - kind: arxiv
    queries:
      - "agent trajectory triage"
      - "agent trajectory sampling preference data"
      - "hindsight experience replay LLM agent"
      - "agent observability tracing"
      - "agent trace schema structured logging"
      - "harness self-improvement evaluation"
      - "agent harness evolution test-time"
      - "turn-level credit assignment tool-use agent"
      - "process supervision vs outcome RL agent"
    priority: high
  - kind: semantic_scholar
    queries:
      - "agent trajectory observability"
      - "harness evolution evaluation sampling baseline"
    priority: normal

paper_axes:
  - id: loop_stage
    name: "Experience-loop stage"
    values:
      - "capture_stream"
      - "update_weights"
      - "update_harness"
      - "evaluation_protocol"
  - id: cost_profile
    name: "Compute cost regime"
    values:
      - "rule_based"
      - "small_surrogate"
      - "llm_judge"
      - "agent_judge"
  - id: lifecycle
    name: "When the method runs"
    values:
      - "training_time"
      - "deployment_time"
      - "online"

cadence:
  default_interval_days: 7
  backoff_after_empty_runs: 3
